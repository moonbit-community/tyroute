name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit version
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check . example/serve.mbtx

      - name: Check, test, and build supported backends
        run: |
          for target in wasm native; do
            moon check --target "$target"
            moon test --target "$target"
            moon build example --target "$target"
          done

      - name: Check script example against local module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile

          _, imports, source = Path("example/serve.mbtx").read_text().split("---\n", 2)
          with tempfile.TemporaryDirectory(prefix="serve_check_", dir="example") as directory:
              package = Path(directory)
              (package / "moon.pkg").write_text(
                  imports + '\nsupported_targets = "native+wasm"\npkgtype(kind: "executable")\n'
              )
              (package / "main.mbt").write_text(source)
              for target in ["wasm", "native"]:
                  subprocess.run(["moon", "check", directory, "--target", target], check=True)
          PY

      - name: Check generated interfaces
        run: |
          moon info
          git diff --exit-code
