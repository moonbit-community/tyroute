name: publish-module
run-name: Publish tyroute to mooncakes.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-module
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit version
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Prepublish checks
        run: |
          moon fmt --check . example/serve.mbtx
          moon check
          moon test
          moon info
          git diff --exit-code

      - name: Publish to mooncakes.io
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SECRET" ]]; then
            echo "Error: MOONCAKES_MOONBIT_COMMUNITY_TOKEN secret is not set." >&2
            exit 1
          fi
          umask 077
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s\n' "$SECRET" > "$HOME/.moon/credentials.json"
          moon publish
